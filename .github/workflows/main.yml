name: Alchemi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-engine:
    name: AI Engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install torch (CPU) + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Build dataset
        run: python scripts/build_dataset.py

      - name: Train GATv2 (smoke run)
        run: python train.py --epochs 2

      - name: Run tests
        run: python -m pytest tests -q

  server:
    name: Server (Node + tRPC)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/server/package-lock.json

      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The web app type-shares tRPC routes from apps/server/src via @server/*,
      # so the web build must resolve server dependencies too.
      - name: Install server deps (type-sharing)
        working-directory: apps/server
        run: npm install --no-audit --no-fund

      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SERVER_URL: http://localhost:4000
