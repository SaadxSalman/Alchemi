# Alchemi (Chem-Agent) — full-stack orchestration
#   docker compose up --build
#   → web      http://localhost:3000
#   → server   http://localhost:4000
#   → ai       http://localhost:8000
services:
  mongo:
    image: mongo:7
    container_name: alchemi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: alchemi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-engine:
    build:
      context: ./services/ai-engine
    container_name: alchemi-ai
    restart: unless-stopped
    environment:
      AI_ENGINE_HOST: 0.0.0.0
      AI_ENGINE_PORT: "8000"
      # secrets: create venv/.env locally or pass an env_file below
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  server:
    build:
      context: ./apps/server
    container_name: alchemi-server
    restart: unless-stopped
    environment:
      PORT: "4000"
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/alchemi
      AI_ENGINE_URL: http://ai-engine:8000
      ALCHEMI_API_KEY: ${ALCHEMI_API_KEY:-}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: alchemi-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo-data:
  redis-data: