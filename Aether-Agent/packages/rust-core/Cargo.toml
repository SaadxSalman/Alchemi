[package]
name = "rust-core"
version = "0.1.0"
edition = "2021"
description = "Aether-Agent AI core: satellite image analysis and crisis classification."

[dependencies]
# Web framework for the internal API
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Vision feature extraction (pure Rust — no native LibTorch required)
image = "0.24"

# HTTP client used to download satellite imagery for analysis
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }